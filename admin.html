<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KageBytes Admin</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #ededed;
      --muted: #888888;
      --border: #222222;
      --btn-approve-bg: #ffffff;
      --btn-approve-text: #000000;
      --btn-decline-bg: #e55353;
      --btn-decline-text: #ffffff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: var(--bg);
      color: var(--text);
      max-width: 680px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 20px; }
    .card {
      border: 1px solid var(--border);
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .info { display: flex; flex-direction: column; gap: 4px; flex-grow: 1; }
    .username { font-weight: 600; font-size: 0.95rem; }
    .email, .reason { font-size: 0.85rem; color: var(--muted); }
    .actions { display: flex; gap: 8px; }
    input {
      background: #111;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px;
      border-radius: 4px;
      width: 100%;
      margin-bottom: 12px;
    }
    button {
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .btn-approve {
      background: var(--btn-approve-bg);
      color: var(--btn-approve-text);
    }
    .btn-decline {
      background: var(--btn-decline-bg);
      color: var(--btn-decline-text);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>KageBytes Applicants</h1>

  <div id="auth-section">
    <input type="password" id="secret-input" placeholder="Enter ADMIN_SECRET" />
    <button class="btn-approve" onclick="loadRequests()">Load Applicants</button>
  </div>

  <div id="list-section" style="margin-top: 20px;"></div>

  <script>
    const WORKER_URL = "https://kagebytes-backend.kaagaazforgaming.workers.dev";

    async function loadRequests() {
      const secret = document.getElementById("secret-input").value;
      const list = document.getElementById("list-section");
      list.innerHTML = "Loading...";

      try {
        const res = await fetch(`${WORKER_URL}/api/requests`, {
          headers: { "Authorization": `Bearer ${secret}` }
        });

        if (!res.ok) throw new Error("Unauthorized");

        const data = await res.json();

        if (data.length === 0) {
          list.innerHTML = "<p style='color: var(--muted)'>No pending applications.</p>";
          return;
        }

        list.innerHTML = data.map(req => `
          <div class="card" id="card-${req.username}">
            <div class="info">
              <span class="username">@${req.username}</span>
              <span class="email">${req.email}</span>
              <span class="reason">"${req.reason}"</span>
            </div>
            <div class="actions">
              <button class="btn-approve" onclick="approve('${req.username}')">Approve</button>
              <button class="btn-decline" onclick="decline('${req.username}')">Decline</button>
            </div>
          </div>
        `).join("");

      } catch {
        list.innerHTML = "<p style='color: red'>Invalid ADMIN_SECRET or error fetching requests.</p>";
      }
    }

    async function approve(username) {
      const secret = document.getElementById("secret-input").value;
      const card = document.getElementById(`card-${username}`);
      const buttons = card.querySelectorAll("button");
      buttons.forEach(b => b.disabled = true);

      try {
        const res = await fetch(`${WORKER_URL}/api/approve`, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${secret}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ username })
        });

        if (res.ok) {
          card.remove();
        } else {
          alert("Failed to approve candidate.");
          buttons.forEach(b => b.disabled = false);
        }
      } catch {
        alert("Error sending approval.");
        buttons.forEach(b => b.disabled = false);
      }
    }

    async function decline(username) {
      if (!confirm(`Are you sure you want to decline @${username}?`)) return;

      const secret = document.getElementById("secret-input").value;
      const card = document.getElementById(`card-${username}`);
      const buttons = card.querySelectorAll("button");
      buttons.forEach(b => b.disabled = true);

      try {
        const res = await fetch(`${WORKER_URL}/api/decline`, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${secret}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ username })
        });

        if (res.ok) {
          card.remove();
        } else {
          alert("Failed to decline candidate.");
          buttons.forEach(b => b.disabled = false);
        }
      } catch {
        alert("Error sending decline.");
        buttons.forEach(b => b.disabled = false);
      }
    }
  </script>
</body>
</html>
